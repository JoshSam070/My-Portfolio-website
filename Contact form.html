<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>


<body>

    <div class="container">

        <div class="section-one">
            <h1>Joshua Samuel</h1>
            <p>Web Developer</p>
            <a href="index.html">Home</a>
        </div>

        <form class="contact-form">
            <table>
                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text" placeholder="Enter your name" class="contact-form__input">
                    </td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" placeholder="Enter your email" class="contact-form__input">
                    </td>
                </tr>

                <tr>
                    <td>Message:</td>
                    <td>
                        <textarea rows="4" cols="40" placeholder="Input your message" class="contact-form__textarea"></textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" placeholder="Enter to submit" class="contact-form__submit">
                    </td>
                </tr>


            </table>

        </form>

        <div class="section-five">
            <p class="section-five__title">Social Media:
                <a href="https://www.instagram.com/?hl=en" target="_blank">Instagram, </a>
                <a href="https://www.linkedin.com/login/" target="_blank">Linkedin</a>
            </p>
            <p class="section-five__desc">&copy; Joshua Samuel</p>
        </div>

    </div>
</body>

</html>
